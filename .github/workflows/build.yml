name: Build Athan APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
      - name: Generate and Build APK
        run: |
          flutter create --platforms=android --org com.ashour.athan app
          cd app
          flutter pub add adhan geolocator shared_preferences intl
          python3 -c '
          p = "android/app/src/main/AndroidManifest.xml"
          t = open(p).read()
          perm = "<uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\"/><uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\"/>"
          t = t.replace("<application", perm + "<application", 1).replace("android:label=\"app\"", "android:label=\"مواقيت الأذان\"")
          open(p, "w").write(t)
          '
          cat << 'EOF' > lib/main.dart
          import 'dart:async';
          import 'dart:math' as math;
          import 'package:flutter/material.dart';
          import 'package:adhan/adhan.dart';
          import 'package:geolocator/geolocator.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:intl/intl.dart' hide TextDirection;

          void main() => runApp(const AthanApp());

          const cities = [
            ['الجيزة - أكتوبر / الأهرام', 29.9773, 31.0946],
            ['القاهرة', 30.0444, 31.2357],
            ['الإسكندرية', 31.2001, 29.9187],
            ['المنصورة', 31.0409, 31.3785],
            ['طنطا', 30.7865, 31.0004],
            ['أسيوط', 27.1783, 31.1859],
            ['أسوان', 24.0889, 32.8998],
            ['مكة المكرمة', 21.4225, 39.8262],
          ];

          class AthanApp extends StatelessWidget {
            const AthanApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark(useMaterial3: true).copyWith(
                  scaffoldBackgroundColor: const Color(0xFF0B1612),
                  colorScheme: ColorScheme.fromSeed(seedColor: const Color(0xFF10B981), brightness: Brightness.dark),
                ),
                builder: (ctx, child) => Directionality(textDirection: TextDirection.rtl, child: child!),
                home: const HomeScreen(),
              );
            }
          }

          class HomeScreen extends StatefulWidget {
            const HomeScreen({super.key});
            @override
            State<HomeScreen> createState() => _HomeScreenState();
          }

          class _HomeScreenState extends State<HomeScreen> {
            int tab = 0, tasbih = 0, total = 0;
            double lat = 29.9773, lng = 31.0946;
            String loc = 'الجيزة - أكتوبر / الأهرام', method = 'egyptian', madhab = 'shafi';
            DateTime now = DateTime.now();
            Timer? timer;

            @override
            void initState() {
              super.initState();
              _load();
              timer = Timer.periodic(const Duration(seconds: 1), (_) => setState(() => now = DateTime.now()));
            }

            Future<void> _load() async {
              final p = await SharedPreferences.getInstance();
              setState(() {
                lat = p.getDouble('lat') ?? 29.9773;
                lng = p.getDouble('lng') ?? 31.0946;
                loc = p.getString('loc') ?? loc;
                method = p.getString('m') ?? 'egyptian';
                madhab = p.getString('md') ?? 'shafi';
                total = p.getInt('tot') ?? 0;
              });
            }

            Future<void> _save() async {
              final p = await SharedPreferences.getInstance();
              p.setDouble('lat', lat); p.setDouble('lng', lng); p.setString('loc', loc);
              p.setString('m', method); p.setString('md', madhab); p.setInt('tot', total);
            }

            PrayerTimes _calc(DateTime d) {
              final m = method == 'umm' ? CalculationMethod.umm_al_qura : CalculationMethod.egyptian;
              final par = m.getParameters();
              par.madhab = madhab == 'hanafi' ? Madhab.hanafi : Madhab.shafi;
              return PrayerTimes(Coordinates(lat, lng), DateComponents.from(d), par);
            }

            Future<void> _gps() async {
              try {
                await Geolocator.requestPermission();
                final pos = await Geolocator.getCurrentPosition();
                setState(() { lat = pos.latitude; lng = pos.longitude; loc = 'GPS (${lat.toStringAsFixed(2)}, ${lng.toStringAsFixed(2)})'; });
                _save();
              } catch (_) {}
            }

            @override
            Widget build(BuildContext context) {
              final pt = _calc(now);
              final list = [['الفجر', pt.fajr], ['الشروق', pt.sunrise], ['الظهر', pt.dhuhr], ['العصر', pt.asr], ['المغرب', pt.maghrib], ['العشاء', pt.isha]];
              var nextName = 'الفجر (غداً)';
              var nextTime = _calc(now.add(const Duration(days: 1))).fajr;
              for (final i in list) {
                if ((i[1] as DateTime).isAfter(now)) { nextName = i[0] as String; nextTime = i[1] as DateTime; break; }
              }
              final d = nextTime.difference(now);
              final cd = '${d.inHours.toString().padLeft(2, '0')}:${(d.inMinutes % 60).toString().padLeft(2, '0')}:${(d.inSeconds % 60).toString().padLeft(2, '0')}';
              final tf = DateFormat('hh:mm a');
              final qibla = Qibla(Coordinates(lat, lng)).direction;

              final views = [
                ListView(padding: const EdgeInsets.all(16), children: [
                  Container(
                    padding: const EdgeInsets.all(20),
                    decoration: BoxDecoration(color: const Color(0xFF065F46), borderRadius: BorderRadius.circular(16)),
                    child: Column(children: [
                      Text(loc, style: const TextStyle(color: Colors.white70)),
                      const SizedBox(height: 6),
                      Text('الصلاة القادمة: $nextName', style: const TextStyle(fontSize: 20, fontWeight: FontWeight.bold)),
                      Text(cd, style: const TextStyle(fontSize: 38, fontWeight: FontWeight.bold, color: Color(0xFFFBBF24))),
                    ]),
                  ),
                  const SizedBox(height: 12),
                  ...list.map((r) => Card(
                    color: nextName == r[0] ? const Color(0xFF064E3B) : const Color(0xFF13261F),
                    child: ListTile(
                      title: Text(r[0] as String, style: const TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                      trailing: Text(tf.format(r[1] as DateTime), style: const TextStyle(fontSize: 18, color: Color(0xFFFBBF24))),
                    ),
                  )),
                ]),
                Center(child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [
                  const Text('اتجاه القبلة من الشمال', style: TextStyle(fontSize: 18)),
                  Text('${qibla.toStringAsFixed(1)}°', style: const TextStyle(fontSize: 36, fontWeight: FontWeight.bold, color: Color(0xFFFBBF24))),
                  const SizedBox(height: 20),
                  Transform.rotate(angle: qibla * (math.pi / 180), child: const Icon(Icons.navigation, size: 100, color: Color(0xFF10B981))),
                ])),
                Center(child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [
                  const Text('سبحان الله وبحمده', style: TextStyle(fontSize: 22, fontWeight: FontWeight.bold)),
                  const SizedBox(height: 24),
                  GestureDetector(
                    onTap: () { setState(() { tasbih++; total++; }); _save(); },
                    child: CircleAvatar(radius: 80, backgroundColor: const Color(0xFF065F46), child: Text('$tasbih', style: const TextStyle(fontSize: 44, color: Color(0xFFFBBF24)))),
                  ),
                  const SizedBox(height: 20),
                  OutlinedButton(onPressed: () => setState(() => tasbih = 0), child: Text('تصفير (الإجمالي: $total)')),
                ])),
                ListView(padding: const EdgeInsets.all(16), children: [
                  DropdownButtonFormField<List<Object>>(
                    decoration: const InputDecoration(labelText: 'اختر المدينة', border: OutlineInputBorder()),
                    items: cities.map((c) => DropdownMenuItem(value: c, child: Text(c[0] as String))).toList(),
                    onChanged: (c) { if (c != null) { setState(() { loc = c[0] as String; lat = c[1] as double; lng = c[2] as double; }); _save(); } },
                  ),
                  const SizedBox(height: 16),
                  DropdownButtonFormField<String>(
                    value: method,
                    decoration: const InputDecoration(labelText: 'طريقة الحساب', border: OutlineInputBorder()),
                    items: const [
                      DropdownMenuItem(value: 'egyptian', child: Text('الهيئة المصرية العامة للمساحة')),
                      DropdownMenuItem(value: 'umm', child: Text('تقويم أم القرى')),
                    ],
                    onChanged: (v) { if (v != null) { setState(() => method = v); _save(); } },
                  ),
                  const SizedBox(height: 16),
                  DropdownButtonFormField<String>(
                    value: madhab,
                    decoration: const InputDecoration(labelText: 'المذهب (العصر)', border: OutlineInputBorder()),
                    items: const [
                      DropdownMenuItem(value: 'shafi', child: Text('الجمهور (شافعي)')),
                      DropdownMenuItem(value: 'hanafi', child: Text('حنفي')),
                    ],
                    onChanged: (v) { if (v != null) { setState(() => madhab = v); _save(); } },
                  ),
                ]),
              ];

              return Scaffold(
                appBar: AppBar(
                  title: const Text('مواقيت الأذان والقبلة'),
                  actions: [IconButton(onPressed: _gps, icon: const Icon(Icons.my_location, color: Color(0xFF10B981)))],
                ),
                body: views[tab],
                bottomNavigationBar: NavigationBar(
                  selectedIndex: tab,
                  onDestinationSelected: (i) => setState(() => tab = i),
                  destinations: const [
                    NavigationDestination(icon: Icon(Icons.access_time), label: 'المواقيت'),
                    NavigationDestination(icon: Icon(Icons.explore), label: 'القبلة'),
                    NavigationDestination(icon: Icon(Icons.spa), label: 'السبحة'),
                    NavigationDestination(icon: Icon(Icons.settings), label: 'الإعدادات'),
                  ],
                ),
              );
            }
          }
          EOF
          flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AthanPro-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
          
